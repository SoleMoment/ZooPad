  <style>
    /* 防止内容闪烁 */
    html {

    /* 加载动画 */
    #app:empty::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #app:empty::after {
      content: '🐵';
      position: fixed;
      top: calc(50% + 40px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
